<html lang="de">
<head>

<title>Atlas</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#030610;color:#d7f8ff;font-family:system-ui,sans-serif;overflow:hidden;touch-action:manipulation}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}

#zahn{position:fixed;top:calc(env(safe-area-inset-top) + 14px);right:16px;font-size:26px;color:#3a7f9a;text-decoration:none;z-index:5;padding:6px}
#kopf{position:fixed;top:calc(env(safe-area-inset-top) + 28px);left:0;right:0;text-align:center;pointer-events:none}
#kopf b{display:block;font-size:34px;letter-spacing:.5em;margin-right:-.5em;font-weight:700}
#zustand{display:block;margin-top:10px;font-size:13px;letter-spacing:.4em;margin-right:-.4em;color:#28dcff}
#fuss{position:fixed;z-index:4;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 14px)}
#chips{display:flex;gap:8px}

#chips button.an{border-color:#28dcff;color:#e6fcff;background:#082a3c}
#werk{margin-top:10px;padding:14px 16px;border-radius:16px;border:1.5px solid #2a8fb4;background:rgba(6,22,36,.85)}
#werk small{display:block;color:#ffaa3c;font-size:11px;letter-spacing:.2em}
#werk span{display:block;margin-top:6px;font-size:17px;font-weight:600}
#chips{display:none}
#start{position:fixed;left:14px;right:14px;bottom:150px;display:grid;grid-template-columns:1fr 1fr;gap:10px;transition:opacity .3s;z-index:2}
body.im-gespraech #start{opacity:0;pointer-events:none}
body.werk-leer #werk{display:none}
.kachel{min-height:84px!important;padding:10px 12px!important}.kachel.breit{min-height:70px!important}.kachel b{font-size:22px!important;margin-top:4px!important}
.kachel{border:1.5px solid #2a8fb4;border-radius:16px;background:rgba(6,22,36,.85);padding:12px;min-height:96px;text-align:left;color:#d7f8ff;font-family:inherit;box-shadow:0 0 14px rgba(34,195,234,.13)}

.kachel.liste{cursor:default;min-height:0!important}.kachel.liste small{margin-bottom:2px}
.ek{display:flex;align-items:center;gap:10px;padding:4px 0;font-size:15px;color:#e6fcff;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ek i{width:20px;height:20px;border-radius:50%;border:1.8px solid #2a8fb4;flex:none;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:13px;color:#030610}
.ek.ok{color:#5f8a99;text-decoration:line-through}.ek.ok i{background:#4ade80;border-color:#4ade80;text-decoration:none}
.kachel .ek span{display:inline;margin:0;font-size:15px;color:inherit;line-height:1.2}.ekmehr{font-size:12px;color:#6aa9bd;padding:2px 0}
.ekmehr{margin-bottom:0}@media(max-height:600px){#start .kachel:not(.liste) span{display:none}#start .kachel b{font-size:19px!important}.ek{padding:1px 0}}

#listebox{display:none;position:fixed;inset:0;z-index:20;background:#030610;flex-direction:column;color:#e6fcff}
#listebox.auf{display:flex}
#vbox,#pbox{display:none;position:fixed;inset:0;z-index:20;background:#030610;flex-direction:column;color:#e6fcff}#vbox.auf,#pbox.auf{display:flex}
#vzu,#pzu{width:44px;height:44px;border-radius:50%;border:1.5px solid #2a8fb4;background:transparent;color:#7fd8f0;font-size:20px}
#vinh,#pinh{flex:1;overflow-y:auto;padding:6px 20px calc(20px + env(safe-area-inset-bottom))}#vinh h3,#pinh h3{margin:22px 0 6px;font-weight:400;font-size:12px;letter-spacing:.2em;color:#ffaa3c}#vinh p,#pinh p{margin:6px 0;color:#9fc6d4;font-size:15px;line-height:1.4}
.vtog{width:100%;padding:16px;border-radius:16px;border:1.5px solid #2a8fb4;background:transparent;color:#e6fcff;font:inherit;font-size:20px}.vtog.an{border-color:#7dffb0;color:#7dffb0;background:rgba(125,255,176,.08)}
.vbtn{width:100%;margin-top:10px;padding:13px;border-radius:14px;border:1.5px solid #ffaa3c;background:transparent;color:#ffaa3c;font:inherit;font-size:16px}
.vk{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid #0e2a3a;font-size:19px}.vk i{flex:none;width:28px;height:28px;border:2px solid #22c3ea;border-radius:7px;display:grid;place-items:center;font-style:normal;color:transparent}.vk.ok i{background:#22c3ea;color:#001}
.vl{padding:9px 0;border-bottom:1px solid #0e2a3a;font-size:14px;color:#9fc6d4}.vl b{color:#e6fcff;font-weight:600}.vl em{display:block;font-style:normal;color:#ffaa3c;margin-top:2px}
#vneu{width:100%;box-sizing:border-box;border:1px dashed #2a8fb4;border-radius:14px;background:transparent;padding:13px 14px;font:inherit;font-size:17px;color:#e6fcff;outline:none;margin-top:10px}
#erbox{display:none;position:fixed;inset:0;z-index:20;background:#030610;flex-direction:column;color:#e6fcff}#erbox.auf{display:flex}
#erzu{width:44px;height:44px;border-radius:50%;border:1.5px solid #2a8fb4;background:transparent;color:#7fd8f0;font-size:20px}
#erliste{flex:1;overflow-y:auto;padding:6px 20px calc(20px + env(safe-area-inset-bottom))}
.er{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #0e2a3a;font-size:19px}.er .ez{flex:none;color:#ffaa3c;font-size:14px;min-width:84px}.er .et{flex:1;min-width:0;overflow-wrap:anywhere}
.er button{flex:none;width:44px;height:44px;border-radius:50%;border:1.5px solid #ff6a5a;background:transparent;color:#ff6a5a;font-size:18px}.er.weg{opacity:.3}.erleer{padding:30px 0;color:#6aa9bd;text-align:center}
#lkopf{display:flex;justify-content:space-between;align-items:center;padding:22px 20px 8px}
#lkopf small{color:#ffaa3c;letter-spacing:.2em;font-size:12px}#lkopf h1{margin:4px 0 0;font-weight:300;font-size:30px}
#lzu{width:44px;height:44px;border-radius:50%;border:1.5px solid #2a8fb4;background:transparent;color:#7fd8f0;font-size:20px}
#lliste{flex:1;overflow-y:auto;padding:6px 20px}
#lliste .ek{padding:13px 0;font-size:19px;border-bottom:1px solid #0e2a3a;gap:14px}#lliste .ek i{width:28px;height:28px;font-size:17px}#lliste .ek span{font-size:19px!important}
#lunten{padding:12px 16px calc(20px + env(safe-area-inset-bottom));border-top:1px solid #0e2a3a;background:#030610}
#lneu{width:100%;box-sizing:border-box;border:1px dashed #2a8fb4;border-radius:14px;background:transparent;padding:13px 14px;font:inherit;font-size:17px;color:#e6fcff;outline:none;margin-bottom:10px}
#lneu::placeholder{color:#6aa9bd}
#lraus{width:100%;border:1.5px solid #ffaa3c;color:#ffaa3c;background:transparent;border-radius:14px;padding:12px;font:inherit;font-size:16px}#lraus:disabled{opacity:.35}
.kachel.liste{cursor:pointer}
#reihe{grid-column:span 2;display:flex;gap:8px}#reihe .kachel{flex:1;min-width:0;min-height:0!important;padding:8px!important;text-align:center}#reihe .kachel b{font-size:15px!important;margin-top:3px!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#reihe .kachel span{display:none!important}#reihe .kachel small{letter-spacing:.1em;font-size:9px}#start.kompakt #reihe .kachel{padding:6px!important}#reihe:not(:has(.kachel:not([style*="display: none"]))){display:none}
.kachel.breit{grid-column:span 2;min-height:80px}.kachel.weg{display:none!important}#start.kompakt{gap:6px}#start.kompakt .kachel{min-height:0!important;padding:7px 10px!important}#start.kompakt .kachel b{font-size:17px!important;margin-top:2px!important}#start.kompakt .kachel span{font-size:11px!important;margin-top:1px!important;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;white-space:normal}#start.kompakt .kachel small{font-size:9px}#start.kompakt #k-einkauf,#start.kompakt #k-mitnehmen,#start.kompakt #k-notizen{grid-column:span 1}.kachel.warn{border-color:#ffaa3c}
.kachel small{display:block;font-size:10px;letter-spacing:.2em;color:#ffaa3c}
.kachel b{display:block;font-size:24px;font-weight:300;margin-top:6px;color:#fff;line-height:1.15}
.kachel span{white-space:pre-line;display:block;font-size:12px;color:#8ccbe0;margin-top:4px;line-height:1.35}
#eingabe{display:flex;gap:8px;margin-top:10px;position:relative}
#fotowahl{position:absolute;left:0;bottom:58px;display:flex;flex-direction:column;gap:6px;padding:8px;border:1.5px solid #2a8fb4;border-radius:16px;background:rgba(6,22,36,.97);box-shadow:0 0 18px rgba(34,195,234,.2);z-index:5}
#fotowahl[hidden]{display:none}
#eingabe #fotowahl button{width:auto;border-radius:12px;padding:12px 16px;font-size:15px;text-align:left;white-space:nowrap;border:1.5px solid #28dcff;background:#082a3c;color:#e6fcff;font-family:inherit}
#eingabe input{flex:1;min-width:0;padding:13px 14px;border-radius:999px;border:1.5px solid #2a8fb4;background:rgba(6,22,36,.9);color:#e6fcff;font-size:16px;font-family:inherit}
#eingabe input::placeholder{color:#5a8296}
#eingabe button{flex:none;width:48px;border-radius:50%;border:1.5px solid #28dcff;background:#082a3c;color:#e6fcff;font-size:20px;padding:0}
#werk{max-height:34vh;overflow:auto}
#briefbox{position:fixed;inset:0;display:none;flex-direction:column;gap:10px;padding:14px;background:rgba(3,6,16,.97);z-index:15}
#briefbox.offen{display:flex}
#briefbox h2{margin:0;font-size:12px;letter-spacing:.2em;color:#ffaa3c;font-weight:400}
#brieftext{flex:1;min-height:0;width:100%;padding:12px;border-radius:14px;border:1.5px solid #2a8fb4;background:#061624;color:#e6fcff;font-size:15px;line-height:1.45;font-family:inherit;resize:none;box-sizing:border-box}
#briefknoepfe{display:flex;gap:8px}
#briefknoepfe button{flex:1;padding:13px 6px;border-radius:12px;border:1.5px solid #28dcff;background:#082a3c;color:#e6fcff;font-size:15px;font-family:inherit}
@media print{body>*:not(#briefbox){display:none!important}#briefbox{position:static;display:block!important;background:#fff;padding:0}#briefbox h2,#briefknoepfe{display:none}#brieftext{border:0;background:#fff;color:#000;font-size:12pt;height:auto;overflow:visible;padding:0;font-family:"Times New Roman",serif}}
#pwbox{position:fixed;inset:0;background:rgba(3,6,16,.92);display:none;align-items:center;justify-content:center;z-index:20;padding:24px}
#pwbox form{width:100%;max-width:360px;padding:22px;border-radius:18px;border:1.5px solid #2a8fb4;background:#061624}
#pwbox p{margin:0 0 12px;font-size:15px}
#pwbox input{width:100%;padding:14px;border-radius:12px;border:1.5px solid #234660;background:#030610;color:#e6fcff;font-size:16px}
#pwbox button{margin-top:12px;width:100%;padding:14px;border-radius:12px;border:1.5px solid #28dcff;background:#082a3c;color:#e6fcff;font-size:16px;font-weight:600}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="briefbox"><h2 id="brieftitel">KÜNDIGUNG</h2><textarea id="brieftext" aria-label="Brieftext"></textarea><div id="briefknoepfe"><button type="button" id="b-kopieren">Kopieren</button><button type="button" id="b-pdf">PDF / Drucken</button><button type="button" id="b-zu">Schließen</button></div></div>
<div id="pwbox"><form id="pwform" method="post" action="#"><p id="pwtext">Passwort für Atlas (das aus der Einrichtung)</p><input type="text" name="username" value="Atlas" autocomplete="username" tabindex="-1" aria-hidden="true" style="position:absolute;opacity:0;height:0;width:0;padding:0;border:0"><input id="pwin" name="password" type="password" autocomplete="current-password" autocorrect="off" autocapitalize="off" spellcheck="false"><button id="pwok" type="submit">Weiter</button></form></div>
<div id="upd"><span id="updtext"></span><button id="updgo">Laden</button><button id="updnein">Später</button></div>

<div id="kopf"><b>ATLAS</b><span id="zustand">BEREIT</span></div>
<div id="pbox"><div id="lkopf"><div><small>PARKPLATZ</small><h1 id="ptitel">Auto-Bluetooth</h1></div><button type="button" id="pzu" aria-label="Schließen">✕</button></div><div id="pinh"></div></div>
<div id="vbox"><div id="lkopf"><div><small>WHATSAPP</small><h1 id="vtitel">Aus</h1></div><button type="button" id="vzu" aria-label="Schließen">✕</button></div><div id="vinh"></div></div>
<div id="erbox"><div id="lkopf"><div><small>ERINNERUNGEN</small><h1 id="erzahl">0 offen</h1></div><button type="button" id="erzu" aria-label="Schließen">✕</button></div><div id="erliste"></div></div>
<div id="listebox"><div id="lkopf"><div><small id="ltitel">EINKAUFSLISTE</small><h1 id="lzahl">0 offen</h1></div><button type="button" id="lzu" aria-label="Schließen">✕</button></div><div id="lliste"></div><div id="lunten"><input type="text" id="lneu" enterkeyhint="done" maxlength="200" placeholder="+ Artikel hinzufügen" aria-label="Neuer Eintrag"><button type="button" id="lraus">Abgehakte entfernen</button></div></div>
<div id="start">
  <button class="kachel breit" id="k-termine" data-frage="Welche Termine habe ich heute?"><small>TERMINE HEUTE</small><b>…</b><span></span></button>
  <button class="kachel" id="k-wetter" data-frage="Wie wird das Wetter heute?"><small>WETTER</small><b>…</b><span></span></button>
  <button class="kachel" id="k-tanken" data-frage="Wo tanke ich am günstigsten Diesel?"><small>DIESEL · TANKEN</small><b>…</b><span></span></button>
  <div class="kachel breit liste" id="k-einkauf"><small>EINKAUFSLISTE</small><div class="eke"></div></div>
  <div class="kachel breit liste" id="k-mitnehmen" style="display:none"><small>MITNEHMEN</small><div class="eke"></div></div>

  <button class="kachel" id="k-park" type="button" style="display:none"><small>PARKPLATZ</small><b>…</b><span></span></button>

  </div>

</div>
<div id="fuss">
  <div id="chips"></div>
  <div id="werk"><small id="werklabel">WERKZEUG</small><span id="werktext">Warte auf dich</span></div>
  <form id="eingabe" autocomplete="off"><button type="button" id="fotoknopf" aria-label="Foto machen oder wählen"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button><div id="fotowahl" hidden><button type="button" id="fw-kamera">Foto machen</button><button type="button" id="fw-galerie">Aus Galerie, Dateien oder PDF</button></div><input id="fotodatei" type="file" accept="image/*,application/pdf,.pdf" hidden><input id="fotokamera" type="file" accept="image/*" capture="environment" hidden><input id="eintext" type="text" enterkeyhint="send" placeholder="Oder tippe hier, was du willst" aria-label="Nachricht an Atlas"><button type="submit" aria-label="Senden">&#10148;</button></form>
</div>
<script>
(function(){
"use strict";
var ZUSTAENDE={
  bereit:{name:"BEREIT",text:"Warte auf dich",drehen:.25,ring:.25,fluss:0,puls:.03,hell:.55,amber:0,energie:.12,fr:120,fg:235,fb:255},
  hoert:{name:"HÖRT ZU",text:"Ich höre dir zu …",drehen:.45,ring:.5,fluss:-.2,puls:.10,hell:.8,amber:0,energie:.45,fr:110,fg:255,fb:175},
  denkt:{name:"DENKT NACH",text:"Ich überlege …",drehen:1.4,ring:1.6,fluss:1,puls:.06,hell:1,amber:.35,energie:.6,fr:255,fg:200,fb:110},
  arbeitet:{name:"ARBEITET",text:"Kalender wird durchsucht …",drehen:2.2,ring:2.4,fluss:.6,puls:.05,hell:1,amber:1,energie:.7,fr:255,fg:165,fb:70},
  spricht:{name:"SPRICHT",text:"Ich antworte dir",drehen:.7,ring:.8,fluss:-1,puls:.16,hell:.95,amber:0,energie:1,fr:205,fg:120,fb:255}
};
var REIHE=["hoert","denkt","arbeitet","spricht"];
var cv=document.getElementById("c"),g=cv.getContext("2d"),W,H,cx,cy,R,dpr=1;
var klein=true,platz={cy:170,R:48};
function messen(){var f=document.getElementById("fuss"),st=document.getElementById("start");if(!f||!st)return;var fh=f.offsetHeight;st.style.bottom=(fh+calcB()+12)+"px";
  var ko=document.getElementById("kopf"),oben=(ko.offsetHeight||70)+(parseFloat(getComputedStyle(ko).top)||28)+8;
  var reihe=["k-notizen","k-mitnehmen","k-einkauf","k-tanken","k-wetter"].map(function(i){return document.getElementById(i)}).filter(Boolean);
  reihe.forEach(function(k){k.classList.remove("weg")});st.classList.remove("kompakt");
  var frei=function(){return innerHeight-(fh+calcB()+12)-st.getBoundingClientRect().height-6-oben};
  if(frei()<210)st.classList.add("kompakt"); // zu wenig Platz fuer die Kugel: Kacheln kompakter, Einkauf und Notizen nebeneinander
  for(var n=0;n<reihe.length&&frei()<150;n++)reihe[n].classList.add("weg"); // zur Not unwichtigste Kacheln weglassen
  var h=Math.max(90,frei());platz={cy:oben+h/2,R:Math.max(26,Math.min(innerWidth*.12,h/2/2.05))}}
function calcB(){return 14}
function ziele(){return klein?platz:{cy:H*.43,R:Math.min(W*.245,H*.2)}}
function groesse(){dpr=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0);cx=W/2;var z=ziele();cy=z.cy;R=z.R}
groesse();addEventListener("resize",function(){groesse();messen()});
try{new ResizeObserver(function(){messen()}).observe(document.getElementById("start"));new ResizeObserver(function(){messen()}).observe(document.getElementById("fuss"))}catch(e){} // Kacheln wachsen, wenn ihre Daten ankommen: die Kugel passt sich jedes Mal an
var zst="bereit",aktuell=Object.assign({},ZUSTAENDE.bereit),winkel=0,ringW=0,t0=performance.now();
function setze(n){
  if(n==="bereit"&&zst!=="bereit"&&window.AtlasApp&&AtlasApp.heyNeu){setTimeout(function(){try{AtlasApp.heyNeu()}catch(e){}},700)}
  zst=n;if((n==="hoert"||n==="denkt")&&window.AtlasAnim)AtlasAnim.stop();var z=ZUSTAENDE[n];
  document.getElementById("zustand").textContent=z.name;
  var b=document.querySelectorAll("#chips button");
  for(var i=0;i<b.length;i++)b[i].classList.toggle("an",b[i].dataset.z===n);
}
var knoten=[];for(var i=0;i<64;i++){var u=Math.random()*6.283,v=Math.acos(2*Math.random()-1);knoten.push([Math.sin(v)*Math.cos(u),Math.cos(v),Math.sin(v)*Math.sin(u)])}
var teil=[];function neuTeil(p){var a=Math.random()*6.283,r=R*(.55+Math.random()*1.9);p.a=a;p.r=r;p.s=.6+Math.random()*1.8;p.c=Math.random()<.12?1:0;p.l=Math.random();return p}
for(i=0;i<190;i++)teil.push(neuTeil({}));
function mix(a,b,k){return a+(b-a)*k}
function bogen(r,a0,a1,w,col,al){g.globalAlpha=al;g.strokeStyle=col;g.lineWidth=w;g.beginPath();g.arc(cx,cy,r,a0,a1);g.stroke()}
var ringe=[];(function(){var rnd=function(a,b){return a+Math.random()*(b-a)};

    if(!j||!j.ok)return;try{localStorage.setItem("atlas_upd_z",String(Date.now()))}catch(e){}
    var nein=0;try{nein=+localStorage.getItem("atlas_upd_nein")||0}catch(e){}
    if(!j.neu||!j.url||j.nummer<=nein)return;
    tx.textContent="Es gibt eine neue Version von Atlas ("+j.nummer+").";box.className="an";
    document.getElementById("updgo").onclick=function(){try{A.oeffnen(j.url)}catch(e){}box.className=""};
    document.getElementById("updnein").onclick=function(){try{localStorage.setItem("atlas_upd_nein",String(j.nummer))}catch(e){}box.className=""};
  }).catch(function(){})})();
</script>
